<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Model Önizleme</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><style>body{font:16px system-ui;margin:0;background:#edf5e9;color:#173d31}header{padding:14px 18px}h1{font-size:22px}button{border:0;background:#266a4d;color:white;border-radius:9px;padding:12px 20px;margin-right:6px;font-weight:bold}a{color:#13583d}#viewer{height:70vh;position:relative}a-scene{height:100%;width:100%}</style></head><body><header><h1>3D Modelleri İncele</h1><p>Bu sayfa AR değildir. `.mind` dosyası gerekmeden modelleri incelemek için hazırlanmıştır. 3D sahnede fareyle/parmakla yön değiştirilebilir.</p><button id="apple">Elma</button><button id="tree">Ağaç</button><p><a href="index.html">AR sözlüğe dön</a></p></header><div id="viewer"><a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true" background="color:#e9f3e7"><a-assets><a-asset-item id="appleAsset" src="assets/models/elma.glb"></a-asset-item><a-asset-item id="treeAsset" src="assets/models/agac.glb"></a-asset-item></a-assets><a-sky color="#e9f3e7"></a-sky><a-light type="ambient" intensity="1.2"></a-light><a-light type="directional" position="1 2 2" intensity="1"></a-light><a-entity id="appleModel" rotation="-90 0 0" gltf-model="#appleAsset" position="0 1 -2.3" scale="1.6 1.6 1.6" animation="property:rotation;to:-90 360 0;dur:9000;loop:true;easing:linear"></a-entity><a-entity id="treeModel" gltf-model="#treeAsset" position="0 1 -2.3" scale="1.4 1.4 1.4" visible="false" animation="property:rotation;to:0 360 0;dur:9000;loop:true;easing:linear"></a-entity><a-camera position="0 1.1 0" look-controls="enabled:true" wasd-controls="enabled:false"></a-camera></a-scene></div><script>document.getElementById('apple').onclick=()=>{document.getElementById('appleModel').setAttribute('visible',true);document.getElementById('treeModel').setAttribute('visible',false)};document.getElementById('tree').onclick=()=>{document.getElementById('appleModel').setAttribute('visible',false);document.getElementById('treeModel').setAttribute('visible',true)}</script></body></html>
